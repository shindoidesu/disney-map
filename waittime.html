<!DOCTYPE html>
<!-- htmlファイルという宣言 -->

<html lang="ja">
<!-- このページは日本語という意味、これがないと翻訳などができない。 -->

<head>
<!-- ここからの設定は表示されないが準備する場所 -->

  <meta charset="UTF-8">
  <!-- 文字を日本語方式で読ませる。UTF-8という方式で数字と文字が結びついてる。これがないと文字化けの原因になる。 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- スマホの画面サイズにするためのコード。スマホで使われる想定 -->

  <title>待ち時間予測</title>
  <!-- ブラウザ上の名前指定 -->

</head>
<!-- 準備が終わった。 -->

<body>
<!-- 本体、ここから見える部分 -->

  <h1>待ち時間予測です</h1>
  <!-- headingの略。h1が一番大きい。h2、h3と小さくなる -->

  <p>美女と野獣の待ち時間予測してあげますね</p>
  <!-- paragraphの略。見出しじゃなくて説明文として使う。 -->

<input type="date" id="dateInput">
<!-- typeをdateにすると日付を選ぶカレンダーがでる。これは最初に備わっている機能。idは後でjavascriptから呼ぶための名札になる。変数ではなくシール -->

<button onclick="yosoku()">予測する</button>
<!-- ボタンで、onclickはクリックされたらyosokuという命令を実行するという意味。 -->

<p id="kekka">ここに結果が出ます</p>
<!-- 予測結果を表示する場所。idがkekkaなのでjavascriptでここに結果を書き込む。ボタンを押す前はここに結果が出ますと出て、ボタンが押されると予測結果になる -->

<script>
// scriptタグの中にjavascript(動き)を書く。htmlは置くだけ

//  asyncは時間のかかる処理を待てる関数にする印
asyncfunction yosoku(){
  
  const hiduke = document.getElementById("dateInput").value;
  //  選ばれた日付を取り出す。getElementById("dateInput")で日付欄を探して、.valueで中身(選んだ日付)を取る。hidukeという箱に入れる。

  document.getElementById("kekka").textContent = "天気を調べているから待とう";
  //  結果表示欄(id=kekka)に文章を書き込む。textContentは文字を入れる為、インターネット通信で時間がかかるのでテキストを表示させる

// Openmeteoにアクセスするための住所(URL)を組み立てる。openmeteo側に指定されているのもの
// latiudeは経度、longitudeは経度(舞浜の位置)。選んだ日付をstartとendに入れる。
    const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=35.6329&longitude=139.8804"
    + "&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum"
    + "&timezone=Asia/Tokyo"
    + "&start_date=" + hiduke
    + "&end_date=" + hiduke;

  // fetchでそのURLにアクセスしてデータを取ってくる。awaitは取れるまで待つという事
  const response = await fetch(url);

  //帰ってきたデータをjavascriptで扱える形(JSON)に変換する。
  const data = await response.json();

  //  取れたデータから必要な数字を取り出す。[0]は一日分のうち最初の一件
  const saikou = data.daily.temperature_2m_max[0];
  const saitei = data.daily.temperature_2m_min[0];
  const ame    = data.daily.precipitation_sum[0];
  const tneki  = data.daily.weathercode[0];

  // 結果欄に取れた天気を表示する。
  document.getElementById("kekka").textContent =
    hiduke + " の天気: 最高" + saikou + "℃ / 最低" + saitei + "℃ / 降水量" + ame + "mm / 天気コード" + tenki;
}
</script>
</body>
<!-- 本体が終わり -->

</html>
<!-- 全体がおしまい -->
