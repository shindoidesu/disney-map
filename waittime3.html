<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>美女と野獣 待ち時間予測</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #141430;
      --card: #1e1e42;
      --card-line: #2e2e5a;
      --gold: #ffd24a;
      --text: #eef0ff;
      --sub: #8b92c4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Hiragino Sans', 'Meiryo', system-ui, sans-serif;
      background: linear-gradient(170deg, #141430 0%, #0f2342 100%);
      color: var(--text);
      min-height: 100vh;
      padding: calc(16px + var(--safe-top)) 16px calc(32px + var(--safe-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--sub); text-decoration: none;
      font-size: 14px; font-weight: 600; padding: 8px 4px; margin-bottom: 8px;
    }
    .back-btn svg { width: 18px; height: 18px; }

    .title { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .title .accent { color: var(--gold); }
    .subtitle { font-size: 13px; color: var(--sub); margin-bottom: 22px; line-height: 1.6; }

    .date-card {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 18px; padding: 18px; margin-bottom: 18px;
    }
    .date-label { font-size: 12px; color: var(--sub); font-weight: 700; margin-bottom: 10px; }
    .date-row { display: flex; gap: 10px; }
    #dateInput {
      flex: 1; background: #0e0e26; border: 1px solid var(--card-line);
      border-radius: 12px; color: var(--text); font-size: 16px; padding: 14px;
      font-family: inherit; color-scheme: dark;
    }
    #yosokuBtn {
      background: linear-gradient(135deg, #ffd24a, #ffb01f); color: #1a1a2e;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 800;
      padding: 0 24px; cursor: pointer; transition: transform 0.1s ease;
    }
    #yosokuBtn:active { transform: scale(0.96); }

    #message {
      text-align: center; color: var(--sub); font-size: 14px;
      padding: 30px 0; line-height: 1.7; white-space: pre-line;
    }

    #result { display: none; }

    .weather-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .weather-chip {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 12px; padding: 10px 14px; font-size: 13px;
      display: flex; align-items: center; gap: 7px;
    }
    .weather-chip .big { font-size: 17px; }
    .weather-chip .wlabel { color: var(--sub); font-size: 11px; }
    .weather-chip .wval { font-weight: 700; }

    .peak-row { display: flex; gap: 10px; margin-bottom: 18px; }
    .peak-box { flex: 1; border-radius: 14px; padding: 14px; text-align: center; }
    .peak-box.busy { background: rgba(255,90,90,0.14); border: 1px solid rgba(255,90,90,0.3); }
    .peak-box.free { background: rgba(80,210,140,0.14); border: 1px solid rgba(80,210,140,0.3); }
    .peak-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
    .peak-time { font-size: 20px; font-weight: 800; }
    .peak-min { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .peak-box.busy .peak-time { color: #ff8585; }
    .peak-box.free .peak-time { color: #52d28c; }

    .chart-card {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 18px; padding: 18px 14px 14px; margin-bottom: 18px;
    }
    .chart-title {
      font-size: 13px; color: var(--sub); font-weight: 700;
      margin-bottom: 4px; padding-left: 4px;
    }
    .chart-now-note {
      font-size: 11px; color: #ff8585; font-weight: 700;
      margin-bottom: 12px; padding-left: 4px;
    }
    .chart-box { position: relative; height: 300px; }

    .list-card {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 18px; padding: 8px 4px;
    }
    .time-item { display: flex; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--card-line); }
    .time-item:last-child { border-bottom: none; }
    .time-label { width: 56px; font-size: 14px; font-weight: 700; }
    .time-bar-wrap { flex: 1; height: 8px; background: #0e0e26; border-radius: 4px; margin: 0 12px; overflow: hidden; }
    .time-bar { height: 100%; border-radius: 4px; }
    .time-min { width: 52px; text-align: right; font-size: 14px; font-weight: 700; }

    .note { margin-top: 18px; font-size: 11px; color: var(--sub); line-height: 1.6; text-align: center; }
  </style>
</head>

<body>
  <div class="wrap">

    <a href="hyousi2.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      戻る
    </a>

    <div class="title">美女と野獣 <span class="accent">待ち時間予測</span></div>
    <div class="subtitle">日付を選ぶと、天気をもとに時間帯ごとの待ち時間を予測します</div>

    <div class="date-card">
      <div class="date-label">予測したい日</div>
      <div class="date-row">
        <input type="date" id="dateInput">
        <button id="yosokuBtn" onclick="yosoku()">予測する</button>
      </div>
    </div>

    <div id="message">日付を選んで「予測する」を押してください</div>

    <div id="result">

      <div class="weather-row" id="weather-row"></div>

      <div class="peak-row">
        <div class="peak-box busy">
          <div class="peak-label">一番混む</div>
          <div class="peak-time" id="busy-time">--</div>
          <div class="peak-min" id="busy-min">-- 分</div>
        </div>
        <div class="peak-box free">
          <div class="peak-label">一番空く</div>
          <div class="peak-time" id="free-time">--</div>
          <div class="peak-min" id="free-min">-- 分</div>
        </div>
      </div>

      <!-- 統合グラフ：待ち時間・気温・降水量を1枚に重ねる -->
      <div class="chart-card">
        <div class="chart-title">待ち時間・気温・降水量の推移</div>
        <div class="chart-now-note" id="now-note" style="display:none;"></div>
        <div class="chart-box">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <div class="list-card" id="list-card"></div>

      <div class="note">
        ※ この予測は収集した待ち時間データと気象データをもとにした推定値です。<br>
        実際の待ち時間とは異なる場合があります。
      </div>
    </div>
  </div>


<script>
// =========================================================
// 待ち時間の予測ロジックは元のまま。
// グラフは3種類（待ち時間・気温・降水量）を1枚に重ねる。
// =========================================================

let model = null;
let chartInstance = null;

fetch("model.json")
  .then(response => response.json())
  .then(data => { model = data; });

document.getElementById("dateInput").valueAsDate = new Date();


async function yosoku() {

  const hiduke = document.getElementById("dateInput").value;
  if (!hiduke) { showMessage("日付を選んでください"); return; }

  showMessage("天気を調べています…");

  // 1日の天気（daily）と1時間ごとの天気（hourly）を一度に取る
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=35.6329&longitude=139.8804"
    + "&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum"
    + "&hourly=temperature_2m,precipitation"
    + "&timezone=Asia/Tokyo"
    + "&start_date=" + hiduke
    + "&end_date=" + hiduke;

  let data;
  try {
    const response = await fetch(url);
    data = await response.json();
  } catch (e) {
    showMessage("天気の取得に失敗しました。通信環境を確認してください");
    return;
  }

  if (!data.daily || data.daily.temperature_2m_max[0] == null) {
    showMessage("この日の天気データは取得できません。\n16日以内の日付を選んでください");
    return;
  }

  const saikou = data.daily.temperature_2m_max[0];
  const saitei = data.daily.temperature_2m_min[0];
  const ame    = data.daily.precipitation_sum[0];
  const tenkiCode = data.daily.weathercode[0];

  let cloudy = 0, rainy = 0;
  if (tenkiCode >= 51) { rainy = 1; }
  else if (tenkiCode >= 1) { cloudy = 1; }

  const youbi = new Date(hiduke).getDay();
  let saturday = 0, sunday = 0;
  if (youbi === 6) saturday = 1;
  if (youbi === 0) sunday = 1;
  const holiday = 0;

  // 各時間帯の待ち時間を計算（元のまま）
  const times = [];  // "9:15" など（待ち時間の時間帯）
  const mins = [];   // 待ち時間（分）
  for (const jikan in model) {
    const c = model[jikan];
    let yosokuBun =
        c.intercept
      + c.saturday * saturday + c.sunday * sunday + c.holiday * holiday
      + c.cloudy * cloudy + c.rainy * rainy
      + c.max_temp * saikou + c.min_temp * saitei + c.precipitation * ame;
    yosokuBun = Math.max(0, Math.round(yosokuBun));
    times.push(jikan);
    mins.push(yosokuBun);
  }

  // 1時間ごとの気温・降水量を、待ち時間の時間帯（9:15など）に合わせる
  // 待ち時間は30分刻み、気温は1時間刻みなので、各時間帯に一番近い時刻の値を割り当てる
  const tempsAligned = [];
  const rainsAligned = [];

  for (const t of times) {
    const parts = t.split(":");
    const targetHour = parseInt(parts[0]) + parseInt(parts[1]) / 60;

    let nearestTemp = null, nearestRain = null, minDiff = Infinity;
    for (let i = 0; i < data.hourly.time.length; i++) {
      const h = parseInt(data.hourly.time[i].substring(11, 13));
      const diff = Math.abs(h - targetHour);
      if (diff < minDiff) {
        minDiff = diff;
        nearestTemp = data.hourly.temperature_2m[i];
        nearestRain = data.hourly.precipitation[i];
      }
    }
    tempsAligned.push(nearestTemp);
    rainsAligned.push(nearestRain);
  }

  drawResult(hiduke, times, mins, { saikou, saitei, ame, cloudy, rainy }, tempsAligned, rainsAligned);
}


function showMessage(text) {
  const msg = document.getElementById("message");
  msg.textContent = text;
  msg.style.display = "block";
  document.getElementById("result").style.display = "none";
}


function drawResult(hiduke, times, mins, weather, temps, rains) {

  document.getElementById("message").style.display = "none";
  document.getElementById("result").style.display = "block";

  let wEmoji = "☀️", wName = "晴れ";
  if (weather.rainy) { wEmoji = "🌧️"; wName = "雨"; }
  else if (weather.cloudy) { wEmoji = "☁️"; wName = "くもり"; }

  document.getElementById("weather-row").innerHTML = `
    <div class="weather-chip"><span class="big">${wEmoji}</span>
      <div><div class="wlabel">天気</div><div class="wval">${wName}</div></div></div>
    <div class="weather-chip">
      <div><div class="wlabel">最高 / 最低</div><div class="wval">${weather.saikou}° / ${weather.saitei}°</div></div></div>
    <div class="weather-chip">
      <div><div class="wlabel">降水量</div><div class="wval">${weather.ame} mm</div></div></div>
  `;

  let maxIdx = 0, minIdx = 0;
  for (let i = 1; i < mins.length; i++) {
    if (mins[i] > mins[maxIdx]) maxIdx = i;
    if (mins[i] < mins[minIdx]) minIdx = i;
  }
  document.getElementById("busy-time").textContent = times[maxIdx];
  document.getElementById("busy-min").textContent = mins[maxIdx] + " 分";
  document.getElementById("free-time").textContent = times[minIdx];
  document.getElementById("free-min").textContent = mins[minIdx] + " 分";

  const nowLineIndex = getNowLineIndex(hiduke, times);

  drawChart(times, mins, temps, rains, nowLineIndex);
  drawList(times, mins);
}


function getNowLineIndex(hiduke, times) {
  const noteEl = document.getElementById("now-note");
  noteEl.style.display = "none";

  const now = new Date();
  const todayStr = now.getFullYear() + "-"
    + String(now.getMonth() + 1).padStart(2, "0") + "-"
    + String(now.getDate()).padStart(2, "0");
  const selected = hiduke.replace(/\//g, "-");

  if (selected !== todayStr) return -1;

  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const firstMin = timeToMinutes(times[0]);
  const lastMin  = timeToMinutes(times[times.length - 1]);

  if (nowMinutes < firstMin || nowMinutes > lastMin) {
    noteEl.textContent = "🔴 現在は営業時間外です";
    noteEl.style.display = "block";
    return -1;
  }

  let nearest = 0, minDiff = Infinity;
  for (let i = 0; i < times.length; i++) {
    const diff = Math.abs(timeToMinutes(times[i]) - nowMinutes);
    if (diff < minDiff) { minDiff = diff; nearest = i; }
  }
  noteEl.textContent = "🔴 赤い線が現在のおおよその時刻です";
  noteEl.style.display = "block";
  return nearest;
}

function timeToMinutes(t) {
  const parts = t.split(":");
  return parseInt(parts[0]) * 60 + parseInt(parts[1]);
}


// ==================================================
// 統合グラフ：待ち時間・気温・降水量を1枚に重ねる
// ==================================================
// 単位が全部違うので、縦軸を3つ用意する：
//   左軸  = 待ち時間（分）… 主役なので目盛りを表示
//   右軸  = 気温（℃）     … 目盛りを表示
//   隠し軸 = 降水量（mm）  … 棒の高さ用。目盛りは隠す
// ==================================================
function drawChart(times, mins, temps, rains, nowLineIndex) {
  const ctx = document.getElementById("chart");
  if (chartInstance) chartInstance.destroy();

  // 現在時刻の赤い点線
  const nowLinePlugin = {
    id: "nowLine",
    afterDraw(chart) {
      if (nowLineIndex < 0) return;
      const x = chart.scales.x.getPixelForValue(nowLineIndex);
      const c = chart.ctx;
      c.save();
      c.beginPath();
      c.moveTo(x, chart.chartArea.top);
      c.lineTo(x, chart.chartArea.bottom);
      c.lineWidth = 2;
      c.strokeStyle = "#ff5a5a";
      c.setLineDash([4, 3]);
      c.stroke();
      c.restore();
    }
  };

  chartInstance = new Chart(ctx, {
    data: {
      labels: times,
      datasets: [
        {
          // 降水量（棒グラフ・一番後ろ）
          type: "bar",
          label: "降水量(mm)",
          data: rains,
          backgroundColor: "rgba(80,170,255,0.4)",
          borderRadius: 3,
          yAxisID: "yRain",
          order: 3
        },
        {
          // 待ち時間（折れ線・主役）
          type: "line",
          label: "待ち時間(分)",
          data: mins,
          borderColor: "#ffd24a",
          backgroundColor: "rgba(255,210,74,0.12)",
          fill: true,
          tension: 0.4,
          borderWidth: 3,
          pointBackgroundColor: "#ffd24a",
          pointRadius: 2.5,
          yAxisID: "yWait",
          order: 1
        },
        {
          // 気温（折れ線・破線）
          type: "line",
          label: "気温(℃)",
          data: temps,
          borderColor: "#ff9f6b",
          backgroundColor: "transparent",
          borderDash: [5, 3],
          tension: 0.4,
          borderWidth: 2,
          pointRadius: 0,
          yAxisID: "yTemp",
          order: 2
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: true, labels: { color: "#c3c8f0", font: { size: 11 }, boxWidth: 14, padding: 12 } }
      },
      scales: {
        // 左軸：待ち時間（分）
        yWait: {
          position: "left",
          beginAtZero: true,
          grid: { color: "rgba(255,255,255,0.06)" },
          ticks: { color: "#ffd24a", font: { size: 10 } },
          title: { display: true, text: "待ち時間(分)", color: "#ffd24a", font: { size: 10 } }
        },
        // 右軸：気温（℃）
        yTemp: {
          position: "right",
          grid: { display: false },
          ticks: { color: "#ff9f6b", font: { size: 10 } },
          title: { display: true, text: "気温(℃)", color: "#ff9f6b", font: { size: 10 } }
        },
        // 隠し軸：降水量（棒の高さ用。目盛りは出さない）
        yRain: {
          position: "right",
          beginAtZero: true,
          display: false,
          max: 20
        },
        x: {
          grid: { display: false },
          ticks: { color: "#8b92c4", font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 7 }
        }
      }
    },
    plugins: [nowLinePlugin]
  });
}


function drawList(times, mins) {
  const listCard = document.getElementById("list-card");
  const maxMin = Math.max(...mins);
  let html = "";
  for (let i = 0; i < times.length; i++) {
    const m = mins[i];
    const ratio = maxMin > 0 ? (m / maxMin) * 100 : 0;
    const color = minColor(m);
    html += `
      <div class="time-item">
        <div class="time-label">${times[i]}</div>
        <div class="time-bar-wrap"><div class="time-bar" style="width:${ratio}%; background:${color};"></div></div>
        <div class="time-min" style="color:${color};">${m}分</div>
      </div>`;
  }
  listCard.innerHTML = html;
}

function minColor(m) {
  if (m < 40)  return "#52d28c";
  if (m < 80)  return "#ffd24a";
  if (m < 120) return "#ff9f45";
  return "#ff6b6b";
}
</script>
</body>
</html>
