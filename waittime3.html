<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>待ち時間予測</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    :root {
      --bg: #141430;
      --card: #1e1e42;
      --card-line: #2e2e5a;
      --gold: #ffd24a;
      --cyan: #49c3ff;
      --text: #eef0ff;
      --sub: #8b92c4;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Hiragino Sans', 'Meiryo', system-ui, sans-serif;
      background: linear-gradient(170deg, #141430 0%, #0f2342 100%);
      color: var(--text);
      min-height: 100vh;
      padding: calc(16px + var(--safe-top)) 16px calc(32px + var(--safe-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--sub); text-decoration: none;
      font-size: 14px; font-weight: 600; padding: 8px 4px; margin-bottom: 8px;
    }
    .back-btn svg { width: 18px; height: 18px; }

    .title { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .title .accent { color: var(--gold); }
    .subtitle { font-size: 13px; color: var(--sub); margin-bottom: 22px; line-height: 1.6; }

    .date-card {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 18px; padding: 18px; margin-bottom: 14px;
    }
    .date-label { font-size: 12px; color: var(--sub); font-weight: 700; margin-bottom: 10px; }
    .date-row { display: flex; gap: 10px; }
    #dateInput {
      flex: 1; background: #0e0e26; border: 1px solid var(--card-line);
      border-radius: 12px; color: var(--text); font-size: 16px; padding: 14px;
      font-family: inherit; color-scheme: dark;
    }
    #yosokuBtn {
      background: linear-gradient(135deg, #ffd24a, #ffb01f); color: #1a1a2e;
      border: none; border-radius: 12px; font-size: 16px; font-weight: 800;
      padding: 0 24px; cursor: pointer; transition: transform 0.1s ease;
    }
    #yosokuBtn:active { transform: scale(0.96); }

    /* アトラクション選択チップ */
    .pick-row { display: flex; gap: 8px; margin-bottom: 18px; }
    .pick-chip {
      flex: 1; padding: 12px 8px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--card-line);
      color: var(--sub); font-size: 13px; font-weight: 700;
      cursor: pointer; text-align: center;
      transition: all 0.15s ease;
    }
    .pick-chip:active { transform: scale(0.97); }
    .pick-chip.on { color: #1a1a2e; }
    .pick-chip[data-pick="beauty"].on { background: var(--gold); border-color: var(--gold); }
    .pick-chip[data-pick="splash"].on { background: var(--cyan); border-color: var(--cyan); }
    .pick-chip[data-pick="compare"].on { background: #c0a3ff; border-color: #c0a3ff; }

    #message {
      text-align: center; color: var(--sub); font-size: 14px;
      padding: 30px 0; line-height: 1.7; white-space: pre-line;
    }

    #result { display: none; }

    .weather-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .weather-chip {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 12px; padding: 10px 14px; font-size: 13px;
      display: flex; align-items: center; gap: 7px;
    }
    .weather-chip .big { font-size: 17px; }
    .weather-chip .wlabel { color: var(--sub); font-size: 11px; }
    .weather-chip .wval { font-weight: 700; }

    .peak-row { display: flex; gap: 10px; margin-bottom: 18px; }
    .peak-box { flex: 1; border-radius: 14px; padding: 14px; text-align: center; }
    .peak-box.a { background: rgba(255,210,74,0.12); border: 1px solid rgba(255,210,74,0.3); }
    .peak-box.b { background: rgba(73,195,255,0.12); border: 1px solid rgba(73,195,255,0.3); }
    .peak-label { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
    .peak-time { font-size: 20px; font-weight: 800; }
    .peak-min { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .peak-box.a .peak-time { color: var(--gold); }
    .peak-box.b .peak-time { color: var(--cyan); }

    .chart-card {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 18px; padding: 18px 14px 14px; margin-bottom: 18px;
    }
    .chart-title {
      font-size: 13px; color: var(--sub); font-weight: 700;
      margin-bottom: 4px; padding-left: 4px;
    }
    .chart-now-note {
      font-size: 11px; color: #ff8585; font-weight: 700;
      margin-bottom: 12px; padding-left: 4px;
    }
    .chart-box { position: relative; height: 300px; }

    .list-card {
      background: var(--card); border: 1px solid var(--card-line);
      border-radius: 18px; padding: 8px 4px;
    }
    .time-item { display: flex; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--card-line); }
    .time-item:last-child { border-bottom: none; }
    .time-label { width: 56px; font-size: 14px; font-weight: 700; }
    .time-bar-wrap { flex: 1; height: 8px; background: #0e0e26; border-radius: 4px; margin: 0 12px; overflow: hidden; }
    .time-bar { height: 100%; border-radius: 4px; }
    .time-min { width: 52px; text-align: right; font-size: 14px; font-weight: 700; }

    .note { margin-top: 18px; font-size: 11px; color: var(--sub); line-height: 1.6; text-align: center; }
    .note a { color: var(--sub); }
  </style>
</head>

<body>
  <div class="wrap">

    <a href="hyousi2.html" class="back-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      戻る
    </a>

    <div class="title">アトラクション <span class="accent">待ち時間予測</span></div>
    <div class="subtitle">日付を選ぶと、天気をもとに時間帯ごとの待ち時間を予測します</div>

    <div class="date-card">
      <div class="date-label">予測したい日</div>
      <div class="date-row">
        <input type="date" id="dateInput">
        <button id="yosokuBtn" onclick="yosoku()">予測する</button>
      </div>
    </div>

    <!-- アトラクション選択 -->
    <div class="pick-row" id="pick-row">
      <div class="pick-chip on" data-pick="beauty">美女と野獣</div>
      <div class="pick-chip" data-pick="splash">スプラッシュ</div>
      <div class="pick-chip" data-pick="compare">⚖️ 比較</div>
    </div>

    <div id="message">日付とアトラクションを選んで「予測する」を押してください</div>

    <div id="result">

      <div class="weather-row" id="weather-row"></div>

      <div class="peak-row" id="peak-row">
        <div class="peak-box a">
          <div class="peak-label" id="peakA-label">一番混む</div>
          <div class="peak-time" id="peakA-time">--</div>
          <div class="peak-min" id="peakA-min">-- 分</div>
        </div>
        <div class="peak-box b">
          <div class="peak-label" id="peakB-label">一番空く</div>
          <div class="peak-time" id="peakB-time">--</div>
          <div class="peak-min" id="peakB-min">-- 分</div>
        </div>
      </div>

      <!-- 統合グラフ -->
      <div class="chart-card">
        <div class="chart-title" id="chart-title">待ち時間・気温・降水量の推移</div>
        <div class="chart-now-note" id="now-note" style="display:none;"></div>
        <div class="chart-box">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <!-- 時間帯リスト（単体のときだけ） -->
      <div class="list-card" id="list-card"></div>

      <div class="note">
        ※ この予測は収集した待ち時間データと気象データをもとにした推定値です。<br>
        実際の待ち時間とは異なる場合があります。<br>
        気象データ提供：<a href="https://open-meteo.com/">Open-Meteo.com</a>
      </div>
    </div>
  </div>


<script>
// =========================================================
// アトラクションの設定
// model.json  = 美女と野獣の係数
// model2.json = スプラッシュマウンテンの係数
// =========================================================
const ATTRACTIONS = {
  beauty: { name: "美女と野獣",        file: "model.json",  color: "#ffd24a" },
  splash: { name: "スプラッシュ・マウンテン", file: "model2.json", color: "#49c3ff" }
};

// 分析した時間帯（この順でグラフの横軸が並ぶ）
const TIME_SLOTS = [
  "9:15","9:45","10:15","10:45","11:15","11:45",
  "12:15","12:45","13:15","13:45","14:15","14:45",
  "15:15","15:45","16:15","16:45","17:15","17:45",
  "18:15","18:45","19:15","19:45"
];

// 読み込んだ係数を入れる箱
const models = { beauty: null, splash: null };

// 今どのモードか（beauty / splash / compare）
let currentPick = "beauty";

let chartInstance = null;


// ==================================================
// 係数ファイルを「どんな形でも」同じ形に整える
// ・{models:{...}} で包まれていれば中を取り出す
// ・直接 時間帯 が並んでいればそのまま使う
// ・interceptが無い時間帯（データなし）は除く
// ==================================================
function normalizeModel(data) {
  const src = (data && data.models) ? data.models : data;
  const out = {};
  for (const slot in src) {
    const c = src[slot];
    if (c && typeof c.intercept === "number") {
      out[slot] = c;
    }
  }
  return out;
}

// ページを開いたら両方の係数を読み込む
fetch("model.json")
  .then(r => r.json())
  .then(d => { models.beauty = normalizeModel(d); })
  .catch(() => { models.beauty = null; });

fetch("model2.json")
  .then(r => r.json())
  .then(d => { models.splash = normalizeModel(d); })
  .catch(() => { models.splash = null; });

document.getElementById("dateInput").valueAsDate = new Date();


// ==================================================
// アトラクション選択チップ
// ==================================================
document.querySelectorAll(".pick-chip").forEach(chip => {
  chip.onclick = () => {
    document.querySelectorAll(".pick-chip").forEach(c => c.classList.remove("on"));
    chip.classList.add("on");
    currentPick = chip.dataset.pick;
  };
});


// ==================================================
// 予測ボタン
// ==================================================
async function yosoku() {

  const hiduke = document.getElementById("dateInput").value;
  if (!hiduke) { showMessage("日付を選んでください"); return; }

  // 必要な係数が読み込めているか確認
  if (currentPick === "beauty" && !models.beauty) { showMessage("美女と野獣の係数(model.json)が読み込めませんでした"); return; }
  if (currentPick === "splash" && !models.splash) { showMessage("スプラッシュの係数(model2.json)が読み込めませんでした"); return; }
  if (currentPick === "compare" && (!models.beauty || !models.splash)) { showMessage("比較には両方の係数が必要です。\nmodel.json と model2.json を確認してください"); return; }

  showMessage("天気を調べています…");

  // 天気（1日の値 + 1時間ごとの値）を取得
  const url = "https://api.open-meteo.com/v1/forecast"
    + "?latitude=35.6329&longitude=139.8804"
    + "&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum"
    + "&hourly=temperature_2m,precipitation"
    + "&timezone=Asia/Tokyo"
    + "&start_date=" + hiduke
    + "&end_date=" + hiduke;

  let data;
  try {
    const response = await fetch(url);
    data = await response.json();
  } catch (e) {
    showMessage("天気の取得に失敗しました。通信環境を確認してください");
    return;
  }

  if (!data.daily || data.daily.temperature_2m_max[0] == null) {
    showMessage("この日の天気データは取得できません。\n16日以内の日付を選んでください");
    return;
  }

  const weather = {
    saikou: data.daily.temperature_2m_max[0],
    saitei: data.daily.temperature_2m_min[0],
    ame:    data.daily.precipitation_sum[0],
    code:   data.daily.weathercode[0],
    cloudy: 0, rainy: 0
  };
  if (weather.code >= 51) weather.rainy = 1;
  else if (weather.code >= 1) weather.cloudy = 1;

  // 曜日
  const youbi = new Date(hiduke).getDay();
  const day = { sat: youbi === 6 ? 1 : 0, sun: youbi === 0 ? 1 : 0, hol: 0 };

  // 1時間ごとの気温・降水量を各時間帯に合わせる
  const tempsAligned = [];
  const rainsAligned = [];
  for (const t of TIME_SLOTS) {
    const parts = t.split(":");
    const targetHour = parseInt(parts[0]) + parseInt(parts[1]) / 60;
    let nearestTemp = null, nearestRain = null, minDiff = Infinity;
    for (let i = 0; i < data.hourly.time.length; i++) {
      const h = parseInt(data.hourly.time[i].substring(11, 13));
      const diff = Math.abs(h - targetHour);
      if (diff < minDiff) {
        minDiff = diff;
        nearestTemp = data.hourly.temperature_2m[i];
        nearestRain = data.hourly.precipitation[i];
      }
    }
    tempsAligned.push(nearestTemp);
    rainsAligned.push(nearestRain);
  }

  drawResult(hiduke, weather, day, tempsAligned, rainsAligned);
}


// ==================================================
// 1つのアトラクションの各時間帯の待ち時間を計算
// （係数 × 条件 を全部足す。元の計算式と同じ）
// ==================================================
function predictAttraction(modelObj, weather, day) {
  return TIME_SLOTS.map(slot => {
    const c = modelObj[slot];
    if (!c) return null;  // その時間帯のデータが無いときは空ける
    let v =
        c.intercept
      + c.saturday * day.sat + c.sunday * day.sun + c.holiday * day.hol
      + c.cloudy * weather.cloudy + c.rainy * weather.rainy
      + c.max_temp * weather.saikou + c.min_temp * weather.saitei + c.precipitation * weather.ame;
    return Math.max(0, Math.round(v));
  });
}


function showMessage(text) {
  const msg = document.getElementById("message");
  msg.textContent = text;
  msg.style.display = "block";
  document.getElementById("result").style.display = "none";
}


// ==================================================
// 結果を描く（モードで内容を切り替える）
// ==================================================
function drawResult(hiduke, weather, day, temps, rains) {

  document.getElementById("message").style.display = "none";
  document.getElementById("result").style.display = "block";

  // --- 天気サマリー（共通） ---
  let wEmoji = "☀️", wName = "晴れ";
  if (weather.rainy) { wEmoji = "🌧️"; wName = "雨"; }
  else if (weather.cloudy) { wEmoji = "☁️"; wName = "くもり"; }
  document.getElementById("weather-row").innerHTML = `
    <div class="weather-chip"><span class="big">${wEmoji}</span>
      <div><div class="wlabel">天気</div><div class="wval">${wName}</div></div></div>
    <div class="weather-chip">
      <div><div class="wlabel">最高 / 最低</div><div class="wval">${weather.saikou}° / ${weather.saitei}°</div></div></div>
    <div class="weather-chip">
      <div><div class="wlabel">降水量</div><div class="wval">${weather.ame} mm</div></div></div>
  `;

  // 現在時刻の赤線位置
  const nowLineIndex = getNowLineIndex(hiduke);

  if (currentPick === "compare") {
    // ===== 比較モード =====
    const beautyMins = predictAttraction(models.beauty, weather, day);
    const splashMins = predictAttraction(models.splash, weather, day);

    // 上の2ボックスは「各アトラクションの平均待ち時間」にする
    document.getElementById("peakA-label").textContent = "美女と野獣 平均";
    document.getElementById("peakA-time").textContent = avg(beautyMins) + "分";
    document.getElementById("peakA-min").textContent = "最混 " + maxOf(beautyMins) + "分";
    document.getElementById("peakB-label").textContent = "スプラッシュ 平均";
    document.getElementById("peakB-time").textContent = avg(splashMins) + "分";
    document.getElementById("peakB-min").textContent = "最混 " + maxOf(splashMins) + "分";

    document.getElementById("chart-title").textContent = "美女と野獣 と スプラッシュ の待ち時間比較";

    // グラフは2本の待ち時間線＋気温・降水量
    drawChart(
      [
        { label: "美女と野獣",    color: ATTRACTIONS.beauty.color, data: beautyMins },
        { label: "スプラッシュ", color: ATTRACTIONS.splash.color, data: splashMins }
      ],
      temps, rains, nowLineIndex
    );

    // 比較モードでは時間帯リストは隠す
    document.getElementById("list-card").style.display = "none";

  } else {
    // ===== 単体モード（美女と野獣 or スプラッシュ）=====
    const info = ATTRACTIONS[currentPick];
    const modelObj = models[currentPick];
    const mins = predictAttraction(modelObj, weather, day);

    // 一番混む/空く
    let maxIdx = firstValid(mins), minIdx = firstValid(mins);
    for (let i = 0; i < mins.length; i++) {
      if (mins[i] == null) continue;
      if (mins[i] > mins[maxIdx]) maxIdx = i;
      if (mins[i] < mins[minIdx]) minIdx = i;
    }
    document.getElementById("peakA-label").textContent = "一番混む";
    document.getElementById("peakA-time").textContent = TIME_SLOTS[maxIdx];
    document.getElementById("peakA-min").textContent = mins[maxIdx] + " 分";
    document.getElementById("peakB-label").textContent = "一番空く";
    document.getElementById("peakB-time").textContent = TIME_SLOTS[minIdx];
    document.getElementById("peakB-min").textContent = mins[minIdx] + " 分";

    document.getElementById("chart-title").textContent = info.name + " の待ち時間・気温・降水量";

    drawChart(
      [{ label: info.name, color: info.color, data: mins }],
      temps, rains, nowLineIndex
    );

    // 時間帯リスト
    document.getElementById("list-card").style.display = "block";
    drawList(mins);
  }
}


// ==================================================
// 現在時刻の赤線（今日を選んだときだけ）
// ==================================================
function getNowLineIndex(hiduke) {
  const noteEl = document.getElementById("now-note");
  noteEl.style.display = "none";

  const now = new Date();
  const todayStr = now.getFullYear() + "-"
    + String(now.getMonth() + 1).padStart(2, "0") + "-"
    + String(now.getDate()).padStart(2, "0");
  const selected = hiduke.replace(/\//g, "-");
  if (selected !== todayStr) return -1;

  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const firstMin = timeToMinutes(TIME_SLOTS[0]);
  const lastMin  = timeToMinutes(TIME_SLOTS[TIME_SLOTS.length - 1]);
  if (nowMinutes < firstMin || nowMinutes > lastMin) {
    noteEl.textContent = "🔴 現在は営業時間外です";
    noteEl.style.display = "block";
    return -1;
  }
  let nearest = 0, minDiff = Infinity;
  for (let i = 0; i < TIME_SLOTS.length; i++) {
    const diff = Math.abs(timeToMinutes(TIME_SLOTS[i]) - nowMinutes);
    if (diff < minDiff) { minDiff = diff; nearest = i; }
  }
  noteEl.textContent = "🔴 赤い線が現在のおおよその時刻です";
  noteEl.style.display = "block";
  return nearest;
}
function timeToMinutes(t) {
  const p = t.split(":");
  return parseInt(p[0]) * 60 + parseInt(p[1]);
}


// ==================================================
// グラフ（待ち時間の線を1本〜2本 ＋ 気温 ＋ 降水量）
// ==================================================
function drawChart(waitSeries, temps, rains, nowLineIndex) {
  const ctx = document.getElementById("chart");
  if (chartInstance) chartInstance.destroy();

  // 現在時刻の赤い点線
  const nowLinePlugin = {
    id: "nowLine",
    afterDraw(chart) {
      if (nowLineIndex < 0) return;
      const x = chart.scales.x.getPixelForValue(nowLineIndex);
      const c = chart.ctx;
      c.save();
      c.beginPath();
      c.moveTo(x, chart.chartArea.top);
      c.lineTo(x, chart.chartArea.bottom);
      c.lineWidth = 2;
      c.strokeStyle = "#ff5a5a";
      c.setLineDash([4, 3]);
      c.stroke();
      c.restore();
    }
  };

  // 待ち時間の線（1本 or 2本）
  const datasets = waitSeries.map(s => ({
    type: "line",
    label: s.label,
    data: s.data,
    borderColor: s.color,
    backgroundColor: hexToFill(s.color),
    fill: waitSeries.length === 1,   // 1本のときだけ下を塗る
    tension: 0.4,
    borderWidth: 3,
    pointBackgroundColor: s.color,
    pointRadius: 2.5,
    spanGaps: true,
    yAxisID: "yWait",
    order: 1
  }));

  // 気温（破線）
  datasets.push({
    type: "line",
    label: "気温(℃)",
    data: temps,
    borderColor: "#ff9f6b",
    backgroundColor: "transparent",
    borderDash: [5, 3],
    tension: 0.4,
    borderWidth: 2,
    pointRadius: 0,
    spanGaps: true,
    yAxisID: "yTemp",
    order: 2
  });

  // 降水量（棒）
  datasets.push({
    type: "bar",
    label: "降水量(mm)",
    data: rains,
    backgroundColor: "rgba(120,140,200,0.35)",
    borderRadius: 3,
    yAxisID: "yRain",
    order: 3
  });

  chartInstance = new Chart(ctx, {
    data: { labels: TIME_SLOTS, datasets: datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: true, labels: { color: "#c3c8f0", font: { size: 11 }, boxWidth: 14, padding: 10 } }
      },
      scales: {
        yWait: {
          position: "left", beginAtZero: true,
          grid: { color: "rgba(255,255,255,0.06)" },
          ticks: { color: "#c3c8f0", font: { size: 10 } },
          title: { display: true, text: "待ち時間(分)", color: "#c3c8f0", font: { size: 10 } }
        },
        yTemp: {
          position: "right",
          grid: { display: false },
          ticks: { color: "#ff9f6b", font: { size: 10 } },
          title: { display: true, text: "気温(℃)", color: "#ff9f6b", font: { size: 10 } }
        },
        yRain: { position: "right", beginAtZero: true, display: false, max: 20 },
        x: {
          grid: { display: false },
          ticks: { color: "#8b92c4", font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 7 }
        }
      }
    },
    plugins: [nowLinePlugin]
  });
}


// ==================================================
// 時間帯リスト（単体モードだけ）
// ==================================================
function drawList(mins) {
  const listCard = document.getElementById("list-card");
  const maxMin = maxOf(mins);
  let html = "";
  for (let i = 0; i < TIME_SLOTS.length; i++) {
    const m = mins[i];
    if (m == null) continue;
    const ratio = maxMin > 0 ? (m / maxMin) * 100 : 0;
    const color = minColor(m);
    html += `
      <div class="time-item">
        <div class="time-label">${TIME_SLOTS[i]}</div>
        <div class="time-bar-wrap"><div class="time-bar" style="width:${ratio}%; background:${color};"></div></div>
        <div class="time-min" style="color:${color};">${m}分</div>
      </div>`;
  }
  listCard.innerHTML = html;
}

function minColor(m) {
  if (m < 40)  return "#52d28c";
  if (m < 80)  return "#ffd24a";
  if (m < 120) return "#ff9f45";
  return "#ff6b6b";
}

// 線の色を薄い塗り色に変える
function hexToFill(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.12)`;
}

// 小さな計算ヘルパー（nullは無視する）
function avg(arr) { const v = arr.filter(x => x != null); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0; }
function maxOf(arr) { const v = arr.filter(x => x != null); return v.length ? Math.max(...v) : 0; }
function firstValid(arr) { for (let i=0;i<arr.length;i++) if (arr[i]!=null) return i; return 0; }
